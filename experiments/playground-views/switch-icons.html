<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud / Grid switch icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400&family=Crimson+Pro:ital,wght@0,300;1,300&family=Manrope:wght@600&display=swap" rel="stylesheet" />
<style>
  /* Mocks of the /playground Cloud / Grid switch icon, in the site's own
     system (tokens.css): paper ground, ink, one terracotta accent,
     Crimson Pro 300 heads, Manrope 600, Azeret Mono labels.
     Layout: one card per option, each showing the switch in both states. */
  :root {
    --bg: #fcfcfc; --bg-2: #f2f1ef; --fg: #262626; --fg-dim: #707070;
    --line: rgb(0 0 0 / 0.1); --accent: #b4482a;
    --ring: color-mix(in srgb, var(--fg) 6%, transparent);
    --font-serif: 'Crimson Pro', Georgia, serif;
    --font-sans: 'Manrope', system-ui, sans-serif;
    --font-mono: 'Azeret Mono', ui-monospace, monospace;
    --tile: 42px;
    --ease-spring: cubic-bezier(0.34, 1.36, 0.64, 1);
    --ease: cubic-bezier(0.77, 0, 0.175, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1a19; --bg-2: #252422; --fg: #ecebe8; --fg-dim: #a09d98; --line: rgb(255 255 255 / 0.12); --accent: #e0714f; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1b1a19; --bg-2: #252422; --fg: #ecebe8; --fg-dim: #a09d98; --line: rgb(255 255 255 / 0.12); --accent: #e0714f; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-weight: 600; font-size: 14px; }
  main { max-width: 1120px; margin: 0 auto; padding: 56px 24px 80px; display: grid; gap: 32px; }
  h1 { margin: 0; font-family: var(--font-serif); font-weight: 300; font-size: clamp(2rem, 1.7rem + 1.2vw, 2.75rem); letter-spacing: -0.03em; line-height: 1.05; text-wrap: balance; }
  h1 em { font-style: italic; }
  .dek { margin: 8px 0 0; color: var(--fg-dim); max-width: 60ch; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .opt { border: 1px solid var(--line); padding: 20px; display: grid; gap: 16px; align-content: start; }
  .opt header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .opt h2 { margin: 0; font-size: 14px; }
  .tag { font-family: var(--font-mono); font-weight: 400; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); }
  .stage { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; padding: 24px 12px; background: var(--bg-2); }
  .state { display: grid; justify-items: center; gap: 8px; }
  .note { margin: 0; color: var(--fg-dim); line-height: 1.5; font-size: 13px; }

  /* the switch frame, as on the site */
  .sw { display: flex; align-items: center; gap: 18px; padding: 6px 16px; border-radius: 999px; background: var(--bg); box-shadow: 0 0 0 1px var(--ring), 0 8px 24px -16px rgb(0 0 0 / 0.3); }
  .sw button { margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  .sw button:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; border-radius: 4px; }
  .word { min-width: 44px; padding: 10px 2px !important; font-size: 16px; color: var(--fg-dim) !important; transition: color 100ms; }
  .word[aria-pressed="true"], .word:hover { color: var(--fg) !important; }
  .icon { position: relative; width: var(--tile); height: var(--tile); flex: none; transition: transform 100ms; }
  .icon:hover { transform: scale(1.04); }
  .icon:active { transform: scale(0.94); }

  /* morphing pieces: each has its cloud and grid place as custom properties */
  .bit { position: absolute; left: 50%; top: 50%; transition: transform 420ms var(--ease-spring), border-radius 420ms var(--ease); 
         transform: translate(-50%, -50%) translate(var(--cx), var(--cy)) rotate(var(--cr, 0deg)) scale(var(--cs, 1)); }
  [data-mode="grid"] .bit { transform: translate(-50%, -50%) translate(var(--gx), var(--gy)) rotate(0deg) scale(1); }

  /* 1 Now: her painting as a pixel tile, splitting into four */
  .px .whole, .px .q { position: absolute; overflow: hidden; }
  .px .whole { inset: 0; transition: opacity 80ms ease-out 220ms; }
  .px .q { width: 50%; height: 50%; transition: transform 320ms var(--ease-spring); }
  .px .q0 { top: 0; left: 0; } .px .q1 { top: 0; left: 50%; } .px .q2 { top: 50%; left: 0; } .px .q3 { top: 50%; left: 50%; }
  .px img { position: absolute; width: var(--tile); height: var(--tile); image-rendering: pixelated; }
  .px .q1 img, .px .q3 img { left: -100%; } .px .q2 img, .px .q3 img { top: -100%; }
  [data-mode="grid"] .px .whole { opacity: 0; transition: opacity 60ms; }
  [data-mode="grid"] .px .q { transform: scale(0.8); }

  /* 2 Dots */
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }
  .dot.hot { background: var(--accent); }

  /* 3 Cards (line) */
  .crd { width: 17px; height: 13px; border-radius: 3px; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--fg); }
  [data-mode="grid"] .crd { width: 17px; height: 17px; }

  /* 4 Photos */
  .ph { width: 18px; height: 18px; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1.5px var(--bg); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 5 Glyph pair */
  .glyph svg { position: absolute; inset: 7px; width: 28px; height: 28px; transition: opacity 200ms, transform 420ms var(--ease-spring); }
  .glyph .g-grid { opacity: 0; transform: rotate(-90deg) scale(0.6); }
  [data-mode="grid"] .glyph .g-cloud { opacity: 0; transform: rotate(90deg) scale(0.6); }
  [data-mode="grid"] .glyph .g-grid { opacity: 1; transform: none; }

  /* 6 Segmented words, 7 Segmented icons: a sliding ink thumb */
  .seg { position: relative; display: flex; padding: 4px; gap: 0; border-radius: 999px; background: var(--bg); box-shadow: 0 0 0 1px var(--ring), 0 8px 24px -16px rgb(0 0 0 / 0.3); }
  .seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: var(--tw); border-radius: 999px; background: var(--fg); transition: transform 420ms var(--ease); }
  .seg[data-mode="grid"] .thumb { transform: translateX(var(--tw)); }
  .seg button { position: relative; z-index: 1; border: 0; background: none; font: inherit; cursor: pointer; color: var(--fg-dim); border-radius: 999px; transition: color 300ms; display: grid; place-items: center; width: var(--tw); height: 40px; }
  .seg button[aria-pressed="true"] { color: var(--bg); }
  .seg button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .seg.words { --tw: 76px; font-size: 16px; }
  .seg.icons { --tw: 52px; }
  .seg svg { width: 20px; height: 20px; }
  .seg .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  @media (prefers-reduced-motion: reduce) { .bit, .px .whole, .px .q, .glyph svg, .seg .thumb, .seg button { transition: none; } }
</style>
</head>
<body>
<main>
  <div>
    <h1>The <em>Cloud / Grid</em> switch</h1>
    <p class="dek">Seven options for the icon between Cloud and Grid on /playground. Each is shown in both states; press either one to watch it change.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

const SPHERE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>';
const GRID4 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>';

const bit = (cls, cx, cy, gx, gy, cr = 0, cs = 1, inner = '') =>
  `<span class="bit ${cls}" style="--cx:${cx}px;--cy:${cy}px;--gx:${gx}px;--gy:${gy}px;--cr:${cr}deg;--cs:${cs}">${inner}</span>`;

// 2 Dots: a ball of nine dots (one in the accent) → 3 × 3
const ring = [...Array(8)].map((_, i) => { const a = i / 8 * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 11 : 14; return [Math.cos(a) * r, Math.sin(a) * r]; });
const dots = [[0, 0], ...ring];
const g3 = [...Array(9)].map((_, i) => [((i % 3) - 1) * 13, (Math.floor(i / 3) - 1) * 13]);
const dotsHTML = dots.map(([x, y], i) => bit('dot' + (i === 0 ? ' hot' : ''), x.toFixed(1), y.toFixed(1), g3[[4, 1, 2, 5, 8, 7, 6, 3, 0][i]][0], g3[[4, 1, 2, 5, 8, 7, 6, 3, 0][i]][1])).join('');

// 3 Cards, 4 Photos: four pieces in a loose heap → 2 × 2
const heap = [[-6, -5, -14], [6, -6, 9], [-5, 6, 6], [6, 5, -8]];
const g2 = [[-9.5, -9.5], [9.5, -9.5], [-9.5, 9.5], [9.5, 9.5]];
const cardsHTML = heap.map(([x, y, r], i) => bit('crd', x, y, g2[i][0], g2[i][1], r)).join('');
const photos = [IMG.porch, IMG.talk, IMG.hub, IMG.moss];
const photosHTML = heap.map(([x, y, r], i) => bit('ph', x, y, g2[i][0], g2[i][1], r, 1.05, `<img src="${photos[i]}" alt="">`)).join('');

  { id: 'photos', name: 'Photos', tag: 'morph', note: 'Four of her pieces, tilted in a heap, settle into 2 × 2. Closest to the cards on the page; busier at 42px.', icon: photosHTML },
  { id: 'glyph', name: 'Sphere ↔ grid', tag: 'swap', note: 'A line sphere turns into a four-square grid. The most conventional: reads as an icon instantly, says less about the work.',
    icon: `<span class="glyph" style="position:absolute;inset:0"><span class="g-cloud">${SPHERE}</span><span class="g-grid">${GRID4}</span></span>` },
  { id: 'words', name: 'Words only', tag: 'segmented', note: 'No icon: "Cloud" and "Grid" in a segmented control with a sliding ink thumb. Quietest and the clearest state.', seg: 'words' },
  { id: 'icons', name: 'Icons only', tag: 'segmented', note: 'Sphere and grid icons in a segmented control, names on hover and for screen readers. Compact, but relies on the icons.', seg: 'icons' },
];

function pill(o, mode) {
  if (o.seg === 'words') return `<div class="seg words" data-mode="${mode}" role="group" aria-label="Layout"><span class="thumb"></span><button type="button" data-to="cloud" aria-pressed="${mode === 'cloud'}">Cloud</button><button type="button" data-to="grid" aria-pressed="${mode === 'grid'}">Grid</button></div>`;
  if (o.seg === 'icons') return `<div class="seg icons" data-mode="${mode}" role="group" aria-label="Layout"><span class="thumb"></span><button type="button" data-to="cloud" title="Cloud" aria-pressed="${mode === 'cloud'}">${SPHERE}<span class="vh">Cloud</span></button><button type="button" data-to="grid" title="Grid" aria-pressed="${mode === 'grid'}">${GRID4}<span class="vh">Grid</span></button></div>`;
  return `<div class="sw" data-mode="${mode}" role="group" aria-label="Layout"><button type="button" class="word" data-to="cloud" aria-pressed="${mode === 'cloud'}">Cloud</button><button type="button" class="icon" data-to="toggle" aria-label="Switch layout">${o.icon}</button><button type="button" class="word" data-to="grid" aria-pressed="${mode === 'grid'}">Grid</button></div>`;
}
const grid = document.getElementById('grid');
grid.innerHTML = OPTS.map((o, i) => `<section class="opt"><header><h2>${i + 1} · ${o.name}</h2><span class="tag">${o.tag}</span></header><div class="stage"><div class="state">${pill(o, 'cloud')}<span class="tag">Cloud</span></div><div class="state">${pill(o, 'grid')}<span class="tag">Grid</span></div></div><p class="note">${o.note}</p></section>`).join('');

grid.addEventListener('click', e => {
  const b = e.target.closest('button[data-to]'); if (!b) return;
  const p = b.closest('[data-mode]'), cur = p.dataset.mode;
  const to = b.dataset.to === 'toggle' ? (cur === 'cloud' ? 'grid' : 'cloud') : b.dataset.to;
  p.dataset.mode = to;
  p.querySelectorAll('[data-to="cloud"]').forEach(x => x.setAttribute('aria-pressed', to === 'cloud'));
  p.querySelectorAll('[data-to="grid"]').forEach(x => x.setAttribute('aria-pressed', to === 'grid'));
  const lab = p.closest('.state')?.querySelector('.tag'); if (lab) lab.textContent = to === 'cloud' ? 'Cloud' : 'Grid';
});

// the pixel tile, her painting at 12 × 12
const im = new Image(); im.src = IMG.porch;
im.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 12; c.getContext('2d').drawImage(im, 0, 0, 12, 12); const u = c.toDataURL(); document.querySelectorAll('[data-pixel]').forEach(i => i.src = u); };
</script>
</body>
</html>
