<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground — a little life in the still pieces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400&family=Crimson+Pro:ital,wght@0,300;1,300&family=Manrope:wght@600&display=swap" rel="stylesheet">
<style>
  /* Served from the repo root (launch config "sound-mockup"), so the
     pieces come from public/images.
     After mariavasilyeva.com: her wall of tiles is never quite still,
     because every tile is a short loop of the project (a spinner turns,
     a product slides in, a person walks). Her pieces here are paintings
     and photos, so there's no loop to play; these are five ways to give
     a still piece a little life without pretending it's a video.
       A · Breathe      a slow push-in and drift inside the frame
       B · Wet paint    the wash ripples faintly, as if still drying
       C · Scroll pull  pieces stretch with the scroll's speed, then settle
                        (the closest to how Maria's tiles move as they stream)
       D · Window light dappled light drifts across, like sun through leaves
       E · On hover     still at rest; the piece you rest on breathes and ripples
     Nothing moves under reduced motion. */
  :root { --paper: #fcfcfc; --ink: #262626; --ink-dim: #707070; --line: rgb(0 0 0 / 0.1); --screen: #f0efed;
    --font-sans: 'Manrope', system-ui, sans-serif; --font-serif: 'Crimson Pro', serif; --font-mono: 'Azeret Mono', monospace;
    --gutter: 2.5rem; --ease-out: cubic-bezier(.16,1,.3,1); }
  :root[data-mode='dark'] { --paper: #1b1a19; --ink: #ecebe8; --ink-dim: #a09d98; --line: rgb(255 255 255 / 0.12); --screen: #2a2826; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); font-weight: 600; }
  .mono { font-family: var(--font-mono); font-weight: 400; font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .bar { position: sticky; top: 0; z-index: 10; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
    padding: .75rem var(--gutter); background: var(--paper); border-bottom: 1px solid var(--line); }
  .bar .name { font-size: .875rem; margin-right: auto; }
  .pill { border: 1px solid var(--ink); background: none; border-radius: 999px; padding: .4rem .8rem; cursor: pointer;
    font-family: var(--font-mono); font-weight: 400; font-size: .6875rem; letter-spacing: .08em; text-transform: uppercase; }
  .pill[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
  .sep { width: 1px; height: 1.2rem; background: var(--line); margin: 0 .4rem; }
  .note { padding: .9rem var(--gutter) 0; max-width: 62ch; font-size: .75rem; line-height: 1.8; color: var(--ink-dim); min-height: 3.6em; }

  .head { text-align: center; padding: 5rem var(--gutter) 4rem; }
  .head h1 { margin: 0; font-family: var(--font-serif); font-weight: 300; font-size: clamp(2rem, 3vw, 2.75rem); line-height: 1.1; }
  .head h1 em { font-style: italic; }

  /* The wall: columns, even gutters, nothing overlapping. */
  .wall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 76px; padding: 0 var(--gutter) 10rem; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 64px; }
  .col:nth-child(2) { margin-top: 140px; } .col:nth-child(3) { margin-top: 50px; } .col:nth-child(4) { margin-top: 190px; }
  @media (max-width: 900px) { .wall { grid-template-columns: repeat(2, 1fr); gap: 40px; } .col:nth-child(n) { margin-top: 0; } }

  .piece { position: relative; margin: 0; width: var(--w, 86%); align-self: var(--a, center);
    transition: transform .55s var(--ease-out); will-change: transform; }
  .piece:hover { transform: translateY(-4px); }
  .frame { position: relative; overflow: hidden; aspect-ratio: var(--ar); background: var(--screen); }
  .frame img, .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame canvas { opacity: 0; }
  .piece figcaption { position: absolute; top: calc(100% + 8px); left: 0; right: 0; font-family: var(--font-mono); font-weight: 400;
    font-size: .625rem; line-height: 1.3; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-dim);
    opacity: 0; transition: opacity .3s var(--ease-out); }
  .piece:hover figcaption { opacity: 1; }

  /* A · Breathe: each piece pushes in ~6% and drifts, on its own phase. */
  @keyframes breathe {
    0%   { transform: scale(1.02) translate(0, 0); }
    50%  { transform: scale(1.12) translate(var(--dx), var(--dy)); }
    100% { transform: scale(1.02) translate(0, 0); }
  }
  [data-mode-anim='breathe'] .frame img,
  [data-mode-anim='hover'] .piece:hover .frame img { animation: breathe var(--dur) ease-in-out infinite; animation-delay: var(--delay); }
  [data-mode-anim='hover'] .piece:hover .frame img { animation-duration: 6s; animation-delay: 0s; }

  /* B · Wet paint: a canvas redraws the piece in thin strips, each nudged
     by a slow sine, so the wash seems to move very slightly. */
  [data-mode-anim='wet'] .frame canvas,
  [data-mode-anim='hover'] .piece:hover .frame canvas { opacity: 1; }
  [data-mode-anim='hover'] .frame canvas { transition: opacity .6s var(--ease-out); }

  /* C · Scroll pull: transform set from script, from the scroll's speed. */
  [data-mode-anim='pull'] .frame { transform-origin: 50% var(--origin, 50%); }

  /* D · Window light: soft patches of light and shade drift across. */
  .light { position: absolute; inset: -20%; pointer-events: none; opacity: 0; transition: opacity .6s var(--ease-out);
    background:
      radial-gradient(28% 22% at 30% 35%, rgb(255 236 200 / .8), transparent 70%),
      radial-gradient(22% 30% at 70% 60%, rgb(255 236 200 / .7), transparent 70%),
      radial-gradient(30% 20% at 55% 20%, rgb(40 50 30 / .4), transparent 70%),
      radial-gradient(24% 26% at 20% 75%, rgb(40 50 30 / .38), transparent 70%);
    mix-blend-mode: soft-light; filter: blur(6px); }
  @keyframes dapple {
    0%   { transform: translate(-6%, -3%) rotate(0deg); }
    33%  { transform: translate(4%, 2%) rotate(4deg); }
    66%  { transform: translate(-2%, 5%) rotate(-3deg); }
    100% { transform: translate(-6%, -3%) rotate(0deg); }
  }
  [data-mode-anim='light'] .light { opacity: 1; animation: dapple var(--dur) ease-in-out infinite; animation-delay: var(--delay); }

  .rm { display: none; padding: .75rem var(--gutter); font-size: .75rem; line-height: 1.8; background: var(--screen); }
  .rm.show { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) {
    :root:not(.force) .frame img, :root:not(.force) .light { animation: none !important; }
    :root:not(.force) .frame canvas { opacity: 0 !important; }
    :root:not(.force) .frame { transform: none !important; }
  }
</style>
</head>
<body data-mode-anim="hover">
<div class="bar" role="toolbar" aria-label="Motion options">
  <span class="name">Playground · still pieces, a little alive</span>
  <button class="pill" data-opt="breathe">A · Breathe</button>
  <button class="pill" data-opt="wet">B · Wet paint</button>
  <button class="pill" data-opt="pull">C · Scroll pull</button>
  <button class="pill" data-opt="light">D · Window light</button>
  <button class="pill" data-opt="hover" aria-pressed="true">E · On hover</button>
  <button class="pill" data-opt="none">Still (today)</button>
  <span class="sep"></span>
  <button class="pill" data-theme aria-pressed="false">Dark</button>
</div>
<div class="rm" role="status"><span>Your Mac has Reduce Motion on, so the site (and this mock) keeps everything still, as the real page will for visitors like you.</span><button class="pill" data-force>Play the motion anyway</button></div>
<p class="note" aria-live="polite"></p>

<header class="head"><h1>A place for <em>endless</em> experimentation</h1></header>
<div class="wall" id="wall"></div>

<script>
  const P = '../../public/images/';   // relative, so it also works opened straight from Finder
  const pieces = [
    ['play-three.jpg', 1.0, 'In order of height · painted on a digital canvas', 1],
    ['play-porch.jpg', 1.0, 'Before anyone else wakes · painted on a digital canvas'],
    ['beyond/baking-cookie.webp', 0.9, 'Baking class, cookie in hand'],
    ['play-hermione.jpg', 0.73, 'The brightest witch of her age · ink and watercolour on paper'],
    ['play-earrings.jpg', 1.33, 'Half a thought · painted on a digital canvas'],
    ['play-reading.jpg', 0.85, 'The tea went cold · painted on a digital canvas'],
    ['play-care.jpg', 0.96, 'Who holds whom · watercolour on paper'],
    ['beyond/talk-smile.webp', 1.0, 'On stage, talking accessibility'],
    ['play-sage.jpg', 0.63, 'Quiet, for now · painted on a digital canvas'],
    ['play-blue-sari.jpg', 0.75, 'Blue, and in no hurry · ink and watercolour on paper'],
    ['play-green-eyes.jpg', 1.33, 'Someone I almost knew · painted on a digital canvas'],
    ['play-cup.jpg', 1.0, 'Both hands on the cup · ink and watercolour on paper'],
    ['play-late-desk.jpg', 1.33, 'One lamp left on · painted on a digital canvas'],
    ['beyond/blue-sculpture.webp', 0.75, 'A blue wall at a design conference'],
    ['play-bears.jpg', 1.04, 'Company for a slow Sunday · painted on a digital canvas'],
    ['play-one-table.jpg', 1.33, 'Four people, one table · painted on a digital canvas'],
  ];
  const notes = {
    breathe: 'A · Every piece slowly pushes in and drifts a little inside its frame, each on its own timing, so the wall is never quite still. The calmest of the five; reads on photos and paintings alike.',
    wet: 'B · The paint ripples very faintly, as if the wash were still drying. Made for the watercolours; on photos it reads as heat haze, so in the build it would be paintings only.',
    pull: 'C · Closest to Maria’s wall as it streams: scroll fast and each piece stretches with the speed, then settles when you stop. Still when you are.',
    light: 'D · Soft patches of warm light and shade drift across each piece, like sun through leaves onto a gallery wall. Moody; strongest in dark mode.',
    hover: 'E · The wall stays still and calm. Rest on a piece and it comes alive: it breathes and the paint ripples, with the caption. Fits the site’s hover rule: quiet by default, the detail on request.',
    none: 'Today: the pieces are still.',
  };

  // Hang the wall: four columns, deterministic sizes.
  const wall = document.getElementById('wall');
  const cols = Array.from({ length: 4 }, () => { const c = document.createElement('div'); c.className = 'col'; wall.append(c); return c; });
  const aligns = ['flex-start', 'center', 'flex-end'];
  // Hung twice, so there's a wall's worth of scroll to try C on.
  [...pieces, ...pieces.slice(1)].forEach(([file, ar, cap, feature], i) => {
    const f = document.createElement('figure');
    f.className = 'piece';
    const isPaint = cap.includes('·');
    f.style.setProperty('--ar', ar);
    f.style.setProperty('--w', feature ? '100%' : (isPaint ? 78 + (i * 7) % 13 : 60 + (i * 5) % 14) + '%');
    f.style.setProperty('--a', feature ? 'stretch' : aligns[i % 3]);
    f.style.setProperty('--dur', (8 + (i * 3) % 5) + 's');
    f.style.setProperty('--delay', -((i * 2.3) % 12) + 's');
    f.style.setProperty('--dx', ((i % 2 ? 1 : -1) * (2 + i % 3)) + '%');
    f.style.setProperty('--dy', ((i % 3 ? -1 : 1) * (2 + (i + 1) % 2)) + '%');
    f.dataset.paint = isPaint ? '1' : '';
    f.innerHTML = `<div class="frame"><img src="${P + file}" alt=""><canvas></canvas><div class="light"></div></div><figcaption>${cap}</figcaption>`;
    cols[i % 4].append(f);
  });

  // Options.
  const body = document.body, note = document.querySelector('.note');
  const set = (opt) => {
    body.dataset.modeAnim = opt;
    document.querySelectorAll('[data-opt]').forEach(b => b.setAttribute('aria-pressed', b.dataset.opt === opt));
    note.textContent = notes[opt];
    document.querySelectorAll('.frame').forEach(fr => fr.style.transform = '');
  };
  document.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => set(b.dataset.opt)));
  document.querySelector('[data-theme]').addEventListener('click', (e) => {
    const dark = document.documentElement.dataset.mode !== 'dark';
    document.documentElement.dataset.mode = dark ? 'dark' : 'light';
    e.currentTarget.setAttribute('aria-pressed', dark);
  });
  set('hover');

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rm = document.querySelector('.rm');
  if (reduce) rm.classList.add('show');
  document.querySelector('[data-force]').addEventListener('click', () => { reduce = false; document.documentElement.classList.add('force'); rm.classList.remove('show'); });

  // B · Wet paint: strips of the image, each shifted by a slow sine.
  const wets = [...document.querySelectorAll('.piece')].map(p => {
    const img = p.querySelector('img'), cv = p.querySelector('canvas');
    return { p, img, cv, ctx: cv.getContext('2d'), seed: Math.random() * 10, on: false };
  });
  const io = new IntersectionObserver(es => es.forEach(e => { const w = wets.find(w => w.p === e.target); if (w) w.on = e.isIntersecting; }));
  wets.forEach(w => io.observe(w.p));
  let hovered = null;
  document.querySelectorAll('.piece').forEach(p => {
    p.addEventListener('pointerenter', () => hovered = p);
    p.addEventListener('pointerleave', () => { if (hovered === p) hovered = null; });
  });
  function drawWet(w, t) {
    const { img, cv, ctx } = w;
    if (!img.complete || !img.naturalWidth) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    // cover-fit source rect, with a little margin so strips can shift
    const ir = img.naturalWidth / img.naturalHeight, cr = W / H;
    let sw, sh; if (ir > cr) { sh = img.naturalHeight; sw = sh * cr; } else { sw = img.naturalWidth; sh = sw / cr; }
    sw *= 0.97; sh *= 0.97;
    const sx0 = (img.naturalWidth - sw) / 2, sy0 = (img.naturalHeight - sh) / 2;
    const strips = 48, sH = H / strips, srcH = sh / strips;
    const amp = W * 0.012;
    for (let i = 0; i < strips; i++) {
      const y = i / strips;
      const off = Math.sin(y * 9 + t * 0.9 + w.seed) * amp + Math.sin(y * 23 - t * 0.6 + w.seed * 2) * amp * 0.4;
      ctx.drawImage(img, sx0 + off * (sw / W), sy0 + i * srcH, sw, srcH + 1, 0, i * sH, W, sH + 1);
    }
  }

  // C · Scroll pull: stretch by scroll speed, eased back.
  let lastY = scrollY, vel = 0, pull = 0, lastT = performance.now();
  function loop(now) {
    const dt = Math.min(64, now - lastT) / 1000; lastT = now;
    const t = now / 1000, mode = body.dataset.modeAnim;
    if (!reduce) {
      if (mode === 'wet') wets.forEach(w => { if (w.on && w.p.dataset.paint) drawWet(w, t); });
      if (mode === 'hover' && hovered) { const w = wets.find(w => w.p === hovered); drawWet(w, t); }
      const y = scrollY; const v = (y - lastY) / Math.max(dt, 0.001); lastY = y;
      vel += (v - vel) * (1 - Math.exp(-dt * 12));
      if (mode === 'pull') {
        const target = Math.max(-1, Math.min(1, vel / 3000));
        pull += (target - pull) * (1 - Math.exp(-dt * 8));
        const vh = innerHeight;
        document.querySelectorAll('.frame').forEach(fr => {
          const r = fr.getBoundingClientRect();
          if (r.bottom < 0 || r.top > vh) return;
          const k = ((r.top + r.height / 2) / vh - 0.5) * 2; // -1 top … 1 bottom
          const sy = 1 + Math.abs(pull) * 0.2;
          const skew = pull * k * 6;
          fr.style.setProperty('--origin', pull > 0 ? '100%' : '0%');
          fr.style.transform = `scaleY(${sy.toFixed(4)}) skewX(${skew.toFixed(3)}deg)`;
        });
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
