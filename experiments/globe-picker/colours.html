<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel globe colours</title>
<!--
  The pixel globe (picked 2026-11-20) in ten colourways, each turning slowly
  on her table, right of the books beside Moss. Four tones per globe: deep
  sea, sea, land, land highlight, plus the stand. Only for choosing a colour;
  the scroll versions come after.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Crimson+Pro:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fcfcfc;--ink:#262626;--grey:#707070;--sans:'Geist',system-ui,sans-serif;--serif:'Crimson Pro',Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--sans);padding:56px clamp(20px,5vw,72px) 80px}
  h1{font:italic 400 44px/1.05 var(--serif);letter-spacing:-.02em}
  .dek{color:var(--grey);margin-top:10px;max-width:680px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;margin-top:40px}
  .card{border:1px solid rgba(0,0,0,.08);border-radius:20px;overflow:hidden;background:#fff}
  .scene{position:relative;aspect-ratio:440/370;overflow:hidden;background:#fff}
  .scene.dark{background:#1b1a19}
  .scene > .art{position:absolute;width:159.1%;left:-68.2%;top:-67.6%}
  .moss{position:absolute;left:60.2%;bottom:42.7%;width:24%;transform:translateX(-53%) translateY(4.6%)}
  .globe{position:absolute;left:83%;bottom:19.5%;width:22%;transform:translateX(-50%);aspect-ratio:100/112}
  .globe canvas{position:absolute;left:8%;top:0;width:84%;aspect-ratio:1;image-rendering:pixelated}
  .globe svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .big{position:absolute;right:12px;top:12px;width:30%;aspect-ratio:1;image-rendering:pixelated;border-radius:8px}
  .meta{padding:14px 18px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .meta b{font:500 15px/1.3 var(--sans)}
  .meta b span{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;text-align:center;line-height:22px;margin-right:8px}
  .meta p{color:var(--grey);margin-top:4px;font-size:13px}
  .sw{display:flex;gap:3px;flex-shrink:0;margin-top:3px}
  .sw i{width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
</style>
</head>
<body>
<h1>The pixel globe, in more colours</h1>
<p class="dek">Each turns slowly on your table beside Moss, with a larger copy in the corner so you can see the pixels. Tell me the number, or two to combine.</p>
<div class="grid" id="grid"></div>

<script>
const I = '../../public/images/';
// [deep sea, sea, land, land highlight], stand, note
const WAYS = [
  ['His sky blue', ['#00aaff', '#4aa8f5', '#8dc8fb', '#ffffff'], '#a37b45', 'The andreas blue, for reference.'],
  ['Peach', ['#d9744f', '#f0a07c', '#f9c9a9', '#fff1e6'], '#a37b45', 'Soft and warm; quiet on a white page.'],
  ['Clay', ['#b4482a', '#c86a4d', '#e3a68f', '#f8e4da'], '#8a5f37', 'Your site accent, #b4482a.'],
  ['Oxblood', ['#5c1712', '#93443a', '#cf968f', '#f3dfdb'], '#6b4a33', 'Deep and grown-up; the home cards’ line colour.'],
  ['Peach sea, oxblood land', ['#f0a07c', '#f9c9a9', '#93443a', '#5c1712'], '#6b4a33', 'Light seas, dark continents. Reads most like a map.'],
  ['Her sweater', ['#8f2f22', '#b5452f', '#efe4d2', '#ffffff'], '#a37b45', 'The red of her sweater and the cream of her trousers.'],
  ['Old desk globe', ['#5f8f93', '#8fb5b3', '#d6b47e', '#efdcb6'], '#8a5f37', 'Muted teal sea, parchment land: an antique globe.'],
  ['Ink', ['#1d1d1b', '#4a4a46', '#b3b3ad', '#f2f2ef'], '#3a2a22', 'Black and greys; the work brings the colour.'],
  ['Moss green', ['#4d5b3a', '#6f7f52', '#c9c29a', '#f1ecd6'], '#8a5f37', 'From Moss’s leaf hat: olive and straw.'],
  ['Night (dark mode)', ['#1e2a3a', '#2f4258', '#e8b25c', '#ffe3a3'], '#8a5f37', 'Dark sea, lamplit land, for the dark theme.', true],
];
const hash = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); };
const sm = t => t * t * (3 - 2 * t);
function noise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * sm(xf) + (c - a) * sm(yf) + (a - b - c + d) * sm(xf) * sm(yf); }
const fbm = (x, y) => noise(x, y) * .55 + noise(x * 2.1, y * 2.1) * .3 + noise(x * 4.3, y * 4.3) * .15;

const grid = document.getElementById('grid');
grid.innerHTML = WAYS.map(([name, c, stand, note, dark], i) => `
  <article class="card">
    <div class="scene${dark ? ' dark' : ''}">
      <img class="art" src="${I}hero-idle.webp" alt="">
      <img class="moss" src="${I}moss/moss-idle.webp" alt="">
      <div class="globe">
        <svg viewBox="0 0 100 112" aria-hidden="true">
          <path d="M10 42 A42 42 0 0 1 90 42" fill="none" stroke="${stand}" stroke-width="3.4" transform="rotate(-22 50 42)"/>
          <path d="M50 82 L50 100" stroke="${stand}" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="50" cy="104" rx="22" ry="6.5" fill="${stand}"/><ellipse cx="50" cy="102" rx="22" ry="5" fill="${stand}" opacity=".7"/>
        </svg>
        <canvas width="26" height="26"></canvas>
      </div>
      <canvas class="big" width="26" height="26" aria-hidden="true"></canvas>
    </div>
    <div class="meta">
      <div><b><span>${i + 1}</span>${name}</b><p>${note}</p></div>
      <div class="sw">${c.map(x => `<i style="background:${x}"></i>`).join('')}</div>
    </div>
  </article>`).join('');

const canvases = [...grid.querySelectorAll('.card')].map((card, i) => ({ cs: card.querySelectorAll('canvas'), c: WAYS[i][1] }));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rot = 0;
function draw() {
  for (const { cs, c } of canvases) for (const cv of cs) {
    const x = cv.getContext('2d'), N = 26; x.clearRect(0, 0, N, N);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const nx = (i + .5) / (N / 2) - 1, ny = (j + .5) / (N / 2) - 1, d = nx * nx + ny * ny; if (d > 1) continue;
      const nz = Math.sqrt(1 - d), lat = -Math.asin(ny) * 57.3, lon = Math.atan2(nx, nz) * 57.3 + rot;
      const v = fbm(((lon % 360) + 360) % 360 / 30, (lat + 90) / 22);
      let col;
      if (v > .56) col = nz < .35 ? c[2] : c[3];          // land, highlight facing you
      else if (v > .5) col = c[2];                         // coast
      else col = nz < .4 ? c[0] : c[1];                    // sea, darker at the rim
      x.fillStyle = col; x.fillRect(i, j, 1, 1);
    }
  }
  if (!reduce) { rot += .6; requestAnimationFrame(draw); }
}
draw();
</script>
</body>
</html>
