<!doctype html>
<html lang="en" data-mode="light" data-variant="d">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beyond work — home mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400&family=Crimson+Pro:ital,wght@0,300;1,300&family=Manrope:wght@600&display=swap" rel="stylesheet" />
<style>
  /* Mock of a "Beyond work" band for the home page, after andreas.vision's
     community ring (measured off the live site, 2026-10-17): photo cards
     on a tilted ring around the headline, drifting slowly, the near half
     passing in front of the words and the far half behind them, smaller,
     fainter and blurred. Drag or arrow keys turn it, with inertia.

     The ring maths and every number below are his:
       angle  t = i/n·2π + turn
       depth  (cos t + 1)/2            1 = nearest
       x      sin t   · W/2 · 0.90
       y      (0.3 + 0.7 cos t) · H/2 · 0.66
       scale  0.55 + 0.45 · depth
       fade   far cards to 45% opacity, blur up to 3px (a pre-blurred copy fading in; his site does it in a WebGL shader)
       drift  0.16 rad/s, eased in at rate 1.6; drag past 6px to turn
     Values copied from src/styles/tokens.css so the mock reads as the
     site; ring values would go under a BEYOND WORK block there.

     Photos are STAND-INS (her playground art) — no UI work in this
     section, on request. Needs her photos and the accessibility poster. */
  :root {
    --font-serif: 'Crimson Pro', Georgia, serif;
    --font-sans: 'Manrope', system-ui, sans-serif;
    --font-mono: 'Azeret Mono', ui-monospace, monospace;
    --paper: #fcfcfc; --paper-2: #f7f7f7; --ink: #262626; --ink-dim: #707070;
    --line: rgb(0 0 0 / 0.1);
    --accent: #b4482a;
    --night-ground: #0d0d0d; --night-ink: #ecebe8; --night-ink-faint: #8a8885;
    --step-heading: clamp(2rem, 1.721rem + 1.143vw, 2.75rem);
    --step-body: 0.875rem; --step-label: 0.75rem; --step-fine: 0.6875rem;
    --tracking-serif: -0.03em; --tracking-label: 0.04em; --tracking-mono: 0.08em;
    --gutter: clamp(1.25rem, 0.786rem + 1.905vw, 2.5rem);
    --radius-page-end: clamp(1.5rem, -0.5rem + 5vw, 5rem);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-hover: 320ms; --dur-micro: 150ms;

    /* BEYOND WORK (new) */
    --ring-h: clamp(40rem, 100svh, 56rem);   /* the band: one screen, capped */
    --ring-card: 216px;                       /* card width; height from the photo */
    --ring-radius: 40px;                      /* his corners (variant A only) */
    --ring-title: 152px;                      /* his headline size (variant A only) */
    --ring-scrim: color-mix(in srgb, var(--paper) 82%, transparent);
    --ring-glare: color-mix(in srgb, #fff 42%, transparent);
    --dur-ring-swap: 600ms;                   /* his arrow swap on the pill */
    --ease-ring-swap: cubic-bezier(0.77, 0, 0.175, 1);
    --dur-ring-open: 550ms;                   /* a photo opening to full size */
    --ring-veil: rgb(20 18 16 / 0.6);
  }
  :root[data-mode='dark'] {
    --paper: #1b1a19; --paper-2: #232220; --ink: #ecebe8; --ink-dim: #a09d98;
    --line: rgb(255 255 255 / 0.12); --accent: #e0714f;
    --ring-glare: color-mix(in srgb, #fff 22%, transparent);
  }
  @media (max-width: 1199.98px) { :root { --ring-card: 148px; --ring-radius: 28px; --ring-title: 112px; } }
  @media (max-width: 809.98px)  { :root { --ring-card: 118px; --ring-radius: 22px; --ring-title: 60px; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--font-sans); font-weight: 600; font-size: var(--step-body); letter-spacing: 0.01em; overflow-x: clip; }

  /* --- mock chrome (not part of the design) --- */
  .mockbar {
    position: fixed; z-index: 2000; left: 50%; bottom: 16px; translate: -50% 0;
    display: flex; gap: 4px; padding: 4px; border-radius: 999px;
    background: #111; color: #eee; font: 400 11px/1 var(--font-mono);
    letter-spacing: var(--tracking-mono); text-transform: uppercase;
    box-shadow: 0 6px 24px rgb(0 0 0 / .25); max-width: calc(100vw - 32px); overflow-x: auto;
  }
  .mockbar button { all: unset; cursor: pointer; padding: 9px 12px; border-radius: 999px; white-space: nowrap; }
  .mockbar button[aria-pressed='true'] { background: #fff; color: #111; }
  .mockbar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .mockbar hr { border: 0; width: 1px; background: #444; margin: 6px 2px; }
  .note {
    max-width: 44rem; margin: 0 auto; padding: 18px var(--gutter) 0;
    font: 400 11px/1.6 var(--font-mono); letter-spacing: var(--tracking-mono);
    text-transform: uppercase; color: var(--ink-dim); text-align: center;
  }

  /* --- context: the tail of the home page --- */
  .stub { padding: 48px var(--gutter); }
  .stub__card { height: 160px; background: var(--paper-2); border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--ink-dim); font: 400 11px var(--font-mono);
    letter-spacing: var(--tracking-mono); text-transform: uppercase; }
  .u-heading { font-family: var(--font-serif); font-weight: 300; letter-spacing: var(--tracking-serif);
    font-size: var(--step-heading); line-height: 1.05; margin: 0; text-wrap: balance; }
  .u-heading em { font-style: italic; }
  .btn--link { position: relative; display: inline-flex; gap: .4em; align-items: center; color: var(--ink);
    font: 600 var(--step-label)/1.2 var(--font-sans); text-transform: uppercase; letter-spacing: var(--tracking-label);
    text-decoration: none; }
  .btn--link::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px;
    background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform var(--dur-hover) var(--ease-out); }
  .btn--link:hover::after, .btn--link:focus-visible::after { transform: scaleX(1); }
  .btn--link .arr { transition: transform var(--dur-hover) var(--ease-out); }
  .btn--link:hover .arr { transform: translateX(3px); }
  .btn--link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .playline { padding: 96px var(--gutter) 120px; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; text-align: center; }
  .playline .u-heading { max-width: 20ch; }
  main { position: relative; z-index: 1; background: var(--paper);
    clip-path: inset(0 round 0 0 var(--radius-page-end) var(--radius-page-end)); }
  footer { background: var(--night-ground); color: var(--night-ink); margin-top: calc(-1 * var(--radius-page-end));
    padding: calc(var(--radius-page-end) + 56px) var(--gutter) 40px; }
  footer p { font: 300 32px/1.1 var(--font-serif); letter-spacing: var(--tracking-serif); margin: 0; }
  footer p em { font-style: italic; text-decoration: underline; text-underline-offset: .15em; text-decoration-thickness: 1px; }

  /* --- BEYOND WORK band --- */
  .beyond { position: relative; height: var(--ring-h); overflow: hidden; background: var(--paper); }
  .stage { position: absolute; inset: 0; cursor: grab; touch-action: pan-y pinch-zoom; user-select: none; outline: none; }
  .stage[data-dragging], .stage[data-dragging] .card { cursor: grabbing; }
  .stage:focus-visible .centre h2 { text-decoration: underline 2px; text-underline-offset: .12em; }

  .centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; pointer-events: none; }
  .centre > * { position: relative; z-index: 32; }   /* between the far cards (1–31) and the near ones (33+) */
  .centre h2 { margin: 0; font-family: var(--font-serif); font-weight: 300; letter-spacing: var(--tracking-serif); text-wrap: balance; }
  .centre h2 em { font-style: italic; }
  .centre p { margin: 0; color: var(--ink-dim); text-wrap: balance; }
  .centre a { pointer-events: auto; z-index: 1000; }   /* the way out is never under a card */

  .card { position: absolute; top: 50%; left: 50%; width: var(--ring-card); margin: 0; padding: 0; border: 0;
    background: none; will-change: transform; contain: layout style; -webkit-tap-highlight-color: transparent;
    perspective: 800px; cursor: inherit; }
  .face { position: absolute; inset: 0; display: block; overflow: hidden; border-radius: inherit; background: var(--paper-2);
    transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); transition: transform 100ms ease-out; }
  .face--empty { display: grid; place-items: center; padding: 12%; border: 1px dashed var(--ink-dim);
    color: var(--ink-dim); font: 400 10px/1.5 var(--font-mono); letter-spacing: var(--tracking-mono);
    text-transform: uppercase; text-align: center; }
  .face img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
  .face img.soft { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
  .card:focus-visible { outline: none; }
  .card:focus-visible .face { outline: 2px solid var(--accent); outline-offset: 4px; overflow: visible; transform: none; }
  .card[data-open] { visibility: hidden; }

  /* A — his exact register: giant headline, rounded cards, ink pills */
  [data-variant='a'] .card { border-radius: var(--ring-radius); }
  [data-variant='a'] .centre h2 { font-size: var(--ring-title); line-height: .86; }
  [data-variant='a'] .centre h2 span { display: block; }
  [data-variant='a'] .centre p { width: min(90%, 30rem); margin-top: 28px; font-size: 17px; line-height: 1.42; }
  .pills { display: none; gap: 8px; margin-top: 28px; color: inherit; text-decoration: none; }
  [data-variant='a'] .pills, [data-variant='d'] .pills { display: inline-flex; }
  [data-variant='a'] .centre .btn--link, [data-variant='d'] .centre .btn--link { display: none; }

  /* D — his layout, rounded cards and pills; our type: 44px serif head
     with the italic word, 14px grey dek, pill labels in our label role */
  [data-variant='d'] .card { border-radius: var(--ring-radius); }
  [data-variant='d'] .centre h2 { font-size: var(--step-heading); line-height: 1.05; }
  [data-variant='d'] .centre p { width: min(90%, 24rem); margin-top: 16px; font-size: var(--step-body); line-height: 1.55; }
  [data-variant='d'] .pills { margin-top: 24px; }
  [data-variant='d'] .pill:not(.round) { font-size: var(--step-label); text-transform: uppercase; letter-spacing: var(--tracking-label); }
  .pill { display: inline-flex; align-items: center; height: 44px; padding: 0 24px; border-radius: 999px;
    background: var(--ink); color: var(--paper); font-size: 15px; white-space: nowrap; transition: transform 100ms ease-out; }
  .pill.round { width: 44px; padding: 0; justify-content: center; position: relative; overflow: hidden; }
  .pill.round svg { position: absolute; transition: transform var(--dur-ring-swap) var(--ease-ring-swap); transform: rotate(-45deg); }
  .pill.round svg + svg { transform: translate(-150%, 150%) rotate(-45deg); }
  .pills:hover .pill.round svg:first-child, .pills:focus-visible .pill.round svg:first-child { transform: translate(150%, -150%) rotate(-45deg); }
  .pills:hover .pill.round svg + svg, .pills:focus-visible .pill.round svg + svg { transform: rotate(-45deg); }
  .pills:hover .pill { transform: scale(1.015); }
  .pills:active .pill { transform: scale(.97); }
  .pills:focus-visible { outline: none; }
  .pills:focus-visible .pill { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* B / C — the same ring in the site's system: 44px head with an italic
     word, 14px grey dek, the "View all work" link style, square cards */
  [data-variant='b'] .card, [data-variant='c'] .card { border-radius: 0; }
  [data-variant='b'] .centre h2, [data-variant='c'] .centre h2 { font-size: var(--step-heading); line-height: 1.05; }
  [data-variant='b'] .centre p, [data-variant='c'] .centre p { width: min(90%, 24rem); margin-top: 16px; font-size: var(--step-body); line-height: 1.55; }
  [data-variant='b'] .centre .btn--link, [data-variant='c'] .centre .btn--link { margin-top: 24px; }
  /* the small head leaves the ring room: cards tighten toward it */

  /* C — cards are buttons: hover tilts toward the pointer under a soft
     light, click opens the photo with its caption */
  [data-variant='c'] .card { cursor: pointer; }
  [data-variant='c'] .stage[data-dragging] .card { cursor: grabbing; }
  [data-variant='c'] .card:hover .face::after { content: ''; position: absolute; inset: -1px; border-radius: inherit;
    background: radial-gradient(circle at var(--light-x, 50%) var(--light-y, 50%), var(--ring-glare) 0, transparent 52%);
    mix-blend-mode: soft-light; pointer-events: none; }
  .stage[data-dragging] .face { transform: none; }

  @media (max-width: 809.98px) {
    .centre::before { content: ''; position: absolute; top: 50%; left: 50%; z-index: 31; width: min(92%, 22rem); height: 15rem;
      transform: translate(-50%, -50%); background: radial-gradient(var(--paper) 0%, var(--ring-scrim) 46%, transparent 76%); filter: blur(4px); }
    [data-variant='a'] .centre p { width: min(82%, 20rem); margin-top: 20px; font-size: 14px; }
    [data-variant='a'] .pills { margin-top: 20px; }
  }

  /* the opened photo (C) */
  .viewer { position: absolute; inset: 0; z-index: 1000; display: grid; place-items: center; }
  .viewer__veil { position: absolute; inset: 0; background: var(--ring-veil); opacity: 0; transition: opacity var(--dur-ring-open) var(--ease-out); }
  .viewer[data-in] .viewer__veil { opacity: 1; }
  .viewer figure { position: absolute; margin: 0; transform-origin: 0 0;
    transition: transform var(--dur-ring-open) var(--ease-out); }
  .viewer img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .viewer figcaption { position: absolute; top: 100%; left: 0; right: 0; padding-top: 12px; color: #f2f1ee;
    font: 400 11px/1.5 var(--font-mono); letter-spacing: var(--tracking-mono); text-transform: uppercase;
    opacity: 0; transition: opacity var(--dur-micro) linear; }
  .viewer[data-settled] figcaption { opacity: 1; }
  .viewer__close { position: absolute; top: 20px; right: 20px; all: unset; position: absolute; top: 20px; right: var(--gutter);
    color: #f2f1ee; font: 400 11px var(--font-mono); letter-spacing: var(--tracking-mono); text-transform: uppercase; cursor: pointer;
    padding: 8px 0; }
  .viewer__close:focus-visible { outline: 2px solid #f2f1ee; outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .face, .pill, .pill.round svg, .btn--link::after, .btn--link .arr, .viewer figure, .viewer__veil { transition: none; }
  }
</style>
</head>
<body>

<main>
  <p class="note" id="note"></p>

  <!-- context: the last stacked project card -->
  <div class="stub"><div class="stub__card">… last project card (Selected work)</div></div>

  <section class="beyond" aria-labelledby="beyond-h">
    <div class="stage" role="group" tabindex="0" aria-label="Photos from outside work. Drag or use the arrow keys to turn the ring.">
      <div class="centre">
        <h2 id="beyond-h"><span>Beyond</span> <span><em>work</em></span></h2>
        <!-- DRAFT — needs her words. Only the talk is confirmed by the repo. -->
        <p>Talking accessibility on stage, painting, meeting designers, and baking cookies. [Your words]</p>
        <a class="pills" href="/about"><span class="pill">More about me</span><span class="pill round" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 14 14"><path d="M1.6 7h10M7 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg width="20" height="20" viewBox="0 0 14 14"><path d="M1.6 7h10M7 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span></a>
        <a class="btn--link" href="/about">More about me <span class="arr" aria-hidden="true">→</span></a>
      </div>
    </div>
  </section>

  <section class="playline">
    <h2 class="u-heading">Smaller experiments live in the <em>playground.</em></h2>
    <a class="btn--link" href="/playground">Explore playground</a>
  </section>
</main>
<footer><p>Let's start with a <em>conversation</em>.</p></footer>

<nav class="mockbar" aria-label="Mock options">
  <button data-v="d">D · Exact, our type</button>
  <button data-v="a">A · Exact</button>
  <button data-v="b">B · Our system</button>
  <button data-v="c">C · Ours + open photo</button>
  <hr />
  <button data-m="light">Light</button>
  <button data-m="dark">Dark</button>
</nav>

<script>
  // STAND-INS: swap for her own photos (talks, meetups, team, life).
  // Fifteen, as on his; aspect ratios vary the way real photos do.
  // No UI work here, on request: life outside work and her paintings.
  // Photos are cut from what she sent; paintings are enhanced copies of
  // the playground files (levels, white balance on the photographed
  // ones). All in public/images/beyond/,
  // 900px on the long side. One talk poster and one mic photo, on request.
  // Alt text describes the image; confirm it.
  const B = '/public/images/beyond/';
  const PHOTOS = [
    [B + 'talk-poster.webp', 'Poster for her talk, The Saga of Accessibility, on Design Sundays', 1.78],
    [B + 'art-porch.webp', 'Painting: a figure reading the paper on sunlit red steps', 1],
    [B + 'blue-sculpture.webp', 'At a design conference, in front of a blue sculpture', 0.75],
    [B + 'baking-cookie.webp', 'Holding a fresh cookie up to one eye at a baking class', 0.9],
    [B + 'art-earrings.webp', 'Digital painting: a woman in profile with a hair bun and earrings', 1.33],
    [B + 'event-selfie.webp', 'A group selfie with designers at an event', 1.37],
    [B + 'art-hermione.webp', 'Ink and watercolour: Hermione with her wand', 0.73],
    [B + 'office-garden.webp', 'With a colleague in the office garden', 1.33],
    [B + 'talk-smile.webp', 'On stage with a mic, laughing at a question', 1],
    [B + 'art-reading.webp', 'Illustration: reading on a sofa with a cup of tea', 0.85],
    [B + 'sticky-wall.webp', 'With friends at a conference wall of sticky notes', 0.56],
    [B + 'art-green-eyes.webp', 'Digital painting: a girl with green eyes', 1.33],
    [B + 'baking-icing.webp', 'Piping chocolate onto cookies at a baking class', 0.59],
    [B + 'meetup-group.webp', 'A design meetup, everyone in one photo', 1.96],
    [B + 'art-sage.webp', 'Digital painting: a woman with long black hair, eyes closed', 0.63],
    [B + 'blue-sculpture-friend.webp', 'With a friend in front of the blue sculpture', 0.75],
    [B + 'office-garden-2.webp', 'Arms crossed with a colleague in the office garden', 1.14],
  ];

  const NOTES = {
    d: 'D · his section — ring, rounded cards, ink pills — in our type: 44px serif head with an italic word, 14px dek, label-style pill text.',
    a: 'A · his section as it is: 152px headline, 40px rounded cards, ink pills. Breaks our 44px head, square corners and link style.',
    b: 'B · same ring, same motion, in our system: 44px head with an italic word, square cards, the "View all work" link. Turns only.',
    c: 'C · B, plus his full version: cards tilt to the pointer under a soft light, and click opens the photo with a caption. Esc closes.',
  };

  // --- the ring (his numbers; see header) -----------------------------
  const DRIFT = 0.16, SPREAD_X = 0.9, SPREAD_Y = 0.66, BLUR = 3, FADE = 0.45;
  const EASE_RATE = 1.6, DRAG_START = 6, TILT = 8, FRONT_Z = 33;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const place = (i, n, turn) => {
    const t = (i / n) * Math.PI * 2 + turn, depth = (Math.cos(t) + 1) / 2;
    return { x: Math.sin(t), y: 0.3 + 0.7 * Math.cos(t), depth, scale: 0.55 + 0.45 * depth };
  };
  const look = (depth) => {
    const r = clamp((0.6 - depth) / 0.6);
    return { blur: clamp((r - 0.1) / 0.9) * BLUR, opacity: 1 - r * (1 - FADE) };
  };

  const root = document.documentElement;
  const stage = document.querySelector('.stage');
  const cards = PHOTOS.map(([src, alt, aspect], i) => {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'card';
    el.style.aspectRatio = aspect;
    el.setAttribute('aria-label', `Open photo: ${alt}`);
    el.innerHTML = src
      ? `<span class="face"><img src="${src}" alt="" decoding="async"><img class="soft" src="${src.replace('.webp', '-blur.webp')}" alt="" decoding="async"></span>`
      : `<span class="face face--empty"><span>${alt}</span></span>`;
    el.dataset.alt = alt; if (src) el.dataset.src = src;
    stage.append(el);
    return el;
  });

  let turn = 0, speed = reduce ? 0 : DRIFT, dir = 1, raf = 0, last = 0, visible = true, held = false, kbd = false;
  let W = stage.offsetWidth, H = stage.offsetHeight, drag = null, dragged = false;
  const softs = cards.map((el) => el.querySelector('.soft'));
  const memo = cards.map(() => ({ o: '', f: '', z: '' }));

  function paint() {
    const ax = (W / 2) * SPREAD_X, ay = (H / 2) * SPREAD_Y;
    const ps = cards.map((_, i) => place(i, cards.length, turn));
    const order = ps.map((_, i) => i).sort((a, b) => ps[a].depth - ps[b].depth);
    order.forEach((i, rank) => {
      const p = ps[i], el = cards[i], m = memo[i], { blur, opacity } = look(p.depth);
      el.style.transform = `translate(-50%, -50%) translate3d(${(p.x * ax).toFixed(1)}px, ${(p.y * ay).toFixed(1)}px, 0) scale(${p.scale.toFixed(3)})`;
      const o = opacity.toFixed(2); if (o !== m.o) el.style.opacity = m.o = o;
      // the blur is a pre-blurred copy fading in, not a live filter:
      // opacity is cheap for the browser, a changing blur() re-renders
      const f = (blur / BLUR).toFixed(2); if (f !== m.f && softs[i]) softs[i].style.opacity = m.f = f;
      const z = String((p.depth >= 0.5 ? FRONT_Z : 1) + rank); if (z !== m.z) el.style.zIndex = m.z = z;
      const ti = p.depth > 0.5 && root.dataset.variant === 'c' ? 0 : -1; if (el.tabIndex !== ti) el.tabIndex = ti;
    });
  }

  function tick(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    let target = 0;
    if (!drag) {
      target = held || kbd || reduce ? 0 : DRIFT * dir;
      speed += (target - speed) * (1 - Math.exp(-dt * EASE_RATE));
      turn += speed * dt;
    }
    paint();
    if (!drag && target === 0 && Math.abs(speed) < 5e-4) return;
    if (visible && !document.hidden) raf = requestAnimationFrame(tick);
  }
  const wake = () => { if (!raf && visible && !document.hidden) { last = 0; raf = requestAnimationFrame(tick); } };

  stage.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || held) return;
    drag = { id: e.pointerId, x: e.clientX, t: e.timeStamp, travel: 0 }; dragged = false; speed = 0;
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dt = Math.max(1, e.timeStamp - drag.t) / 1000;
    drag.travel += Math.abs(dx); drag.x = e.clientX; drag.t = e.timeStamp;
    if (!dragged && drag.travel > DRAG_START) { dragged = true; stage.dataset.dragging = ''; stage.setPointerCapture(e.pointerId); }
    if (!dragged) return;
    const d = dx / ((W / 2) * SPREAD_X);
    turn += d; speed = speed * 0.6 + (d / dt) * 0.4; wake();
  });
  const up = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (e.timeStamp - drag.t > 80) speed = 0;          // held still before letting go: no fling
    if (Math.abs(speed) > 0.05) dir = Math.sign(speed); // drift on the way it was thrown
    drag = null; delete stage.dataset.dragging; wake();
  };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('dragstart', (e) => e.preventDefault());
  stage.addEventListener('keydown', (e) => {
    if (held || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault(); dir = e.key === 'ArrowLeft' ? -1 : 1; speed += dir * 1.4; kbd = false; wake();
  });
  // keyboard focus holds the ring still so a focused card doesn't slide away
  stage.addEventListener('focusin', (e) => { kbd = e.target.matches(':focus-visible'); wake(); });
  stage.addEventListener('focusout', () => { kbd = false; wake(); });
  new ResizeObserver(() => { W = stage.offsetWidth; H = stage.offsetHeight; paint(); }).observe(stage);
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; wake(); }).observe(stage);
  document.addEventListener('visibilitychange', wake);
  paint(); wake();

  // --- C: tilt + light, open a photo ----------------------------------
  const variant = () => document.documentElement.dataset.variant;
  cards.forEach((el, i) => {
    el.addEventListener('pointermove', (e) => {
      if (variant() !== 'c' || e.pointerType !== 'mouse' || stage.dataset.dragging !== undefined) return;
      const r = el.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
      el.style.setProperty('--tilt-x', `${((0.5 - fy) * TILT).toFixed(2)}deg`);
      el.style.setProperty('--tilt-y', `${((fx - 0.5) * TILT).toFixed(2)}deg`);
      el.style.setProperty('--light-x', `${(fx * 100).toFixed(1)}%`);
      el.style.setProperty('--light-y', `${(fy * 100).toFixed(1)}%`);
    });
    el.addEventListener('pointerleave', () => ['--tilt-x', '--tilt-y', '--light-x', '--light-y'].forEach((p) => el.style.removeProperty(p)));
    el.addEventListener('click', () => { if (variant() === 'c' && !dragged && el.dataset.src) open(i); });
  });

  // run fn once the photo's own move ends (not its caption's fade), or
  // after the duration anyway, so a dropped transitionend never strands it
  const OPEN_MS = 550;
  const after = (fig, fn) => {
    let done = false; const go = () => { if (!done) { done = true; fn(); } };
    fig.addEventListener('transitionend', function h(e) { if (e.target === fig && e.propertyName === 'transform') { fig.removeEventListener('transitionend', h); go(); } });
    setTimeout(go, OPEN_MS + 100);
  };

  function open(i) {
    const el = cards[i], band = stage.parentElement, br = band.getBoundingClientRect(), r = el.getBoundingClientRect();
    held = true; el.dataset.open = ''; stage.inert = true;
    const v = document.createElement('div');
    v.className = 'viewer'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true'); v.setAttribute('aria-label', el.dataset.alt);
    v.innerHTML = `<div class="viewer__veil"></div><figure><img src="${el.dataset.src}" alt="${el.dataset.alt}"><figcaption>${el.dataset.alt}</figcaption></figure><button class="viewer__close">Close ✕</button>`;
    band.append(v);
    const fig = v.querySelector('figure'), aspect = r.width / r.height;
    let h = Math.min(br.height * 0.72, (br.width * 0.8) / aspect), w = h * aspect;
    const left = (br.width - w) / 2, top = (br.height - h) / 2 - 16;
    Object.assign(fig.style, { left: `${left}px`, top: `${top}px`, width: `${w}px`, height: `${h}px` });
    const from = `translate(${r.left - br.left - left}px, ${r.top - br.top - top}px) scale(${r.width / w}, ${r.height / h})`;
    fig.style.transition = 'none'; fig.style.transform = from;
    fig.getBoundingClientRect();
    fig.style.transition = ''; fig.style.transform = 'none'; v.dataset.in = '';
    const settle = () => (v.dataset.settled = '');
    reduce ? settle() : after(fig, settle);
    const close = () => {
      delete v.dataset.settled; delete v.dataset.in;
      const r2 = el.getBoundingClientRect();
      fig.style.transform = `translate(${r2.left - br.left - left}px, ${r2.top - br.top - top}px) scale(${r2.width / w}, ${r2.height / h})`;
      const done = () => { v.remove(); delete el.dataset.open; stage.inert = false; held = false; el.focus({ preventScroll: true }); wake(); document.removeEventListener('keydown', esc); };
      reduce ? done() : after(fig, done);
    };
    const esc = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', esc);
    v.querySelector('.viewer__veil').addEventListener('click', close);
    const btn = v.querySelector('.viewer__close'); btn.addEventListener('click', close); btn.focus({ preventScroll: true });
    v.addEventListener('keydown', (e) => { if (e.key === 'Tab') { e.preventDefault(); btn.focus(); } });
  }

  // --- mock switcher ---------------------------------------------------
  const note = document.getElementById('note');
  const qs = new URLSearchParams(location.search);
  function set(v, m) {
    if (v) root.dataset.variant = v;
    if (m) root.dataset.mode = m;
    document.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === root.dataset.variant));
    document.querySelectorAll('[data-m]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === root.dataset.mode));
    note.textContent = NOTES[root.dataset.variant] + ' Your photos and enhanced paintings, 21 in all. The line under the headline is still a draft.';
    history.replaceState(null, '', `?v=${root.dataset.variant}&m=${root.dataset.mode}`);
    requestAnimationFrame(paint);
  }
  document.querySelector('.mockbar').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (b) set(b.dataset.v, b.dataset.m);
  });
  set(qs.get('v') || 'd', qs.get('m') || 'light');
  // A and B have no photo to open: the cards aren't buttons there
  const syncRole = () => cards.forEach((el) => {
    const c = variant() === 'c';
    if (c) { el.removeAttribute('aria-hidden'); } else { el.setAttribute('aria-hidden', 'true'); el.tabIndex = -1; }
  });
  new MutationObserver(syncRole).observe(root, { attributes: true, attributeFilter: ['data-variant'] }); syncRole();
</script>
</body>
</html>
