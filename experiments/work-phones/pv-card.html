<!DOCTYPE html>
<!--
  The Privacy hub's reminder card (the blue one), three ways, beside the
  current one. Same screen, same PayPal Sans; only the card changes.
  Top row: the phone at full size (393 pt). Bottom row: the size the home
  page's card shows it (227 px wide), drawn crisp with zoom.
  The shield is her Shopping-screen shield cut onto transparency
  (art/pv-card-shield-cut.png): the card's old cut was clipped at the
  sides and tip and carried scraps of blue and beige round it.
  Served by the "case-v2-mockup" entry: /experiments/work-phones/pv-card.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Privacy hub — reminder card options</title>
<link rel="stylesheet" href="redraw.css">
<style>
  body { margin: 0; padding: 40px; background: #ecebe8; font: 13px/1.5 -apple-system, system-ui, sans-serif; color: #262626; }
  h1 { font: 600 18px/1.3 -apple-system, system-ui, sans-serif; margin: 0 0 6px; }
  .lede { margin: 0 0 32px; color: #555; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(4, 393px); gap: 32px; }
  .opt > h2 { font: 600 13px/1.3 ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px; }
  .opt > p { margin: 0 0 12px; color: #555; min-height: 3em; }
  .phone { position: relative; contain: layout paint; width: 393px; height: 852px; border-radius: 48px; overflow: hidden; box-shadow: 0 0 0 10px #0a0a0b, 0 20px 50px rgb(0 0 0 / .2); background: #fff; }
  .phone .ui { height: 852px; }
  .small { margin-top: 48px; display: flex; justify-content: center; }
  .small .phone { zoom: .5776; }

  /* ---- A · Tidy: same blue, one padding, shield beside the title ---- */
  .o-a .pvcard { padding: 20px; gap: 16px; align-items: flex-start; border-radius: 16px; }
  .o-a .pvcard > div { flex: 1; }
  .o-a .pvcard__t { font-size: 19px; line-height: 1.3; font-weight: 400; text-wrap: balance; }
  .o-a .pvcard__s, .o-c .pvcard__s { text-wrap: pretty; }
  .o-a .pvcard__s { font-size: 15px; line-height: 1.4; margin-top: 6px; opacity: .85; }
  .o-a .pvcard__l { font-size: 16px; margin-top: 16px; display: inline-flex; align-items: center; gap: 6px; }
  .o-a .pvcard__l::after { content: '›'; font-size: 20px; line-height: 1; }
  .o-a .pvcard img { width: 48px !important; flex: none; margin-top: 2px; }

  /* ---- B · Shield leads, a real button ---- */
  .o-b .pvcard { padding: 20px; flex-direction: column; gap: 0; border-radius: 16px; position: relative; }
  .o-b .pvcard img { width: 40px !important; order: -1; margin-bottom: 14px; }
  .o-b .pvcard__t { font-size: 19px; line-height: 1.3; font-weight: 500; text-wrap: balance; }
  .o-b .pvcard__s { font-size: 15px; line-height: 1.4; margin-top: 6px; opacity: .85; }
  .o-b .pvcard__l { margin-top: 18px; display: inline-block; background: #fff; color: #1040c1; font-size: 15px; font-weight: 500; padding: 10px 18px; border-radius: 999px; }

  /* ---- C · Light, like the rows and her Shopping card ---- */
  .o-c .pvcard { background: #fff; color: #101114; box-shadow: 0 1px 4px rgb(0 0 0 / .06); padding: 20px; gap: 16px; align-items: center; border-radius: 12px; }
  .o-c .pvcard > div { flex: 1; }
  .o-c .pvcard__t { font-size: 17px; line-height: 1.3; font-weight: 500; text-wrap: balance; }
  .o-c .pvcard__s { font-size: 15px; line-height: 1.4; margin-top: 6px; color: #5c6068; opacity: 1; }
  .o-c .pvcard__l { font-size: 16px; margin-top: 14px; color: #0070e0; }
  .o-c .pvcard img { width: 56px !important; flex: none; }
</style>
</head>
<body>
<h1>Privacy hub — the reminder card</h1>
<p class="lede">Picked: C (2026-11-18), now in redraw.css, so every column here shows C as its base. Same screen and type (PayPal Sans); only the blue card changes. Bottom row is the size the home page shows it.</p>
<div class="grid" id="grid"></div>
<script src="redraw.js"></script>
<script>
  const opts = [
    ['', 'Current', 'As on the site now: three-line title, shield floating at the bottom on its own square.'],
    ['o-a', 'A · Tidy', 'Same blue. One 20px padding, title in two lines, shield beside it at the top, link with a chevron.'],
    ['o-b', 'B · Shield leads', 'Same blue. Shield on top, full-width title, the action as a white button.'],
    ['o-c', 'C · Light', 'A white card like the rows below it and her Shopping card; blue only on the shield and link.'],
  ];
  const grid = document.getElementById('grid');
  for (const [cls, name, note] of opts) {
    const col = document.createElement('div');
    col.className = 'opt ' + cls;
    col.innerHTML = `<h2>${name}</h2><p>${note}</p><div class="phone">${ui['pv-hub']()}</div><div class="small"><div class="phone">${ui['pv-hub']()}</div></div>`;
    if (cls) col.querySelectorAll('.pvcard img').forEach((i) => { i.src = 'art/pv-card-shield-cut.png'; i.style.alignSelf = ''; });
    grid.append(col);
  }
</script>
</body>
</html>
