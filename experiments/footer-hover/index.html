<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Footer link hover — colour options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400&family=Crimson+Pro:ital,wght@0,300;1,300&family=Manrope:wght@600&display=swap" rel="stylesheet" />
<style>
  /* Values copied from tokens.css (NIGHT FOOTER) so the mock matches the site. */
  :root {
    --night: #0b0b0b;
    --ink: #ecebe8;
    --ink-dim: #a09d98;
    --faint: color-mix(in srgb, #a09d98 80%, #0b0b0b);
    --line: rgb(255 255 255 / 0.14);
    --serif: 'Crimson Pro', Georgia, serif;
    --sans: 'Manrope', system-ui, sans-serif;
    --mono: 'Azeret Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fcfcfc; color: #262626; font: 600 14px/1.5 var(--sans); }
  .intro { padding: 48px 56px 24px; max-width: 900px; }
  .intro h1 { font: 300 44px/1.1 var(--serif); margin: 0 0 12px; }
  .intro h1 em { font-style: italic; }
  .intro p { margin: 0; color: #707070; font-size: 12px; max-width: 640px; }

  .group { margin: 24px 56px 8px; font: 300 32px/1.1 var(--serif); }
  .ref { display: flex; align-items: flex-end; gap: 16px; margin: 0 56px 24px; }
  .ref img { height: 220px; width: auto; }
  .ref img + img { height: 90px; }
  .ref p { margin: 0; max-width: 320px; font-size: 12px; color: #707070; }
  @media (max-width: 1000px) { .ref { margin-inline: 24px; flex-wrap: wrap; } }
  .chip { display: inline-block; width: 14px; height: 14px; margin-right: 4px; vertical-align: -2px; border: 1px solid rgb(0 0 0 / .12); }
  .chip + .chip { margin-right: 8px; }
  .opt { padding: 0 56px 40px; }
  .opt__head {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 16px 0 12px; border-top: 1px solid #e4e4e4;
    font: 400 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .06em;
  }
  .opt__head b { font-weight: 400; color: #262626; }
  .opt__head span { color: #707070; }
  .opt__head .ok { color: #1c7a3f; }
  .opt__head .no { color: #b4482a; }
  .opt__note { margin: 0 0 12px; font-size: 12px; color: #707070; max-width: 640px; }

  /* The footer, as on the site (rows 1 and 2), in miniature. */
  .foot {
    background: var(--night); color: var(--ink);
    border-radius: 0 0 0 0; padding: 48px 40px 0;
  }
  .foot h2 { margin: 0; font: 300 32px/1.1 var(--serif); letter-spacing: -0.01em; }
  .foot h2 a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .14em; }
  .foot h2 em { font-style: italic; }
  .meta {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem 2rem;
    margin-top: 56px; padding-block: 28px; border-top: 1px solid var(--line);
    font: 400 11px/1.4 var(--mono); letter-spacing: .04em;
  }
  .meta .built { color: var(--faint); }
  .nav { display: flex; gap: 1.5rem; justify-content: center; }
  .icons { display: flex; gap: 1rem; justify-content: flex-end; }
  .foot a { color: var(--ink); text-decoration: none; transition: color 160ms cubic-bezier(.16,1,.3,1); }
  .foot h2 a { text-decoration: underline; }
  .icons svg { display: block; }
  .nav a { white-space: nowrap; }
  /* Narrow previews: legal and icons on one line, links under them. */
  @media (max-width: 1000px) {
    .opt, .intro { padding-inline: 24px; } .group { margin-inline: 24px; }
    .foot { padding-inline: 24px; }
    .meta { grid-template-columns: 1fr auto; }
    .nav { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; flex-wrap: wrap; }
  }

  /* The option: real hover, plus "Old portfolio" and "conversation"
     pinned in their hover state so every option can be compared at a glance. */
  .foot a:hover, .foot a:focus-visible, .foot a.is-hover { color: var(--h); }
</style>
</head>
<body>
  <div class="intro">
    <h1>Footer link <em>hover</em></h1>
    <p>Each band is the footer as it is on the site. "conversation" and "Old portfolio" are shown in their hover state; hover the other links to try them live. Contrast is measured against the footer's black (#0b0b0b); AA needs 4.5:1 for this size of text.</p>
  </div>
  <div id="opts"></div>

  <template id="foot">
    <div class="foot">
      <h2>Let's start with a <a class="is-hover" href="#"><em>conversation</em></a>.</h2>
      <div class="meta">
        <p style="margin:0">© 2026 Anupama Mishra · <span class="built">Built with Claude Code &amp; Astro</span></p>
        <nav class="nav">
          <a href="#">Work</a><a href="#">About me</a><a href="#">Playground</a><a class="is-hover" href="#">Old portfolio ↗</a>
        </nav>
        <div class="icons">
          <a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg></a>
          <a href="#" aria-label="Email"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg></a>
        </div>
      </div>
    </div>
  </template>

<script>

    ['03', 'Lilac', '#e0d6ef', 'PayPal\'s project hue. Barely different from the ink — reads as a soft tint.'],
    ['04', 'Butter', '#f4dc9c', 'Walmart\'s project hue. Warm like the clay, without the red.'],
    ['05', 'Green', '#31b564', 'The "available" light from the hero. Says "go" — fits a contact row.'],
    ['06', 'Electric blue', '#7aa7ff', 'A classic link blue, lifted for black. New to the site.'],
    ['07', 'Dim to grey', '#a09d98', 'No colour at all: links step down to the footer\'s grey on hover.'],
    ['Reds'],

    ['09', 'Signal red', '#ff4040', 'A true red, lifted just enough to read on black.'],
    ['10', 'Cherry', '#ff3d6e', 'Red leaning pink. The "cherry red" everyone is wearing this year.'],
    ['11', 'Coral', '#ff7f6e', 'Soft, warm red. Friendlier than signal red, quieter than tomato.'],
    ['12', 'Rose', '#f28b9c', 'Dusty red-pink. The calmest red here.'],
    ['Trendy'],
    ['13', 'Digital lavender', '#b9a6ff', 'The soft violet of the last few seasons. Calm, a little tech.'],
    ['14', 'Hot pink', '#ff4fb0', 'Loud and confident. Pairs with black the way fashion sites do.'],
    ['15', 'Mint', '#7ef0c1', 'Fresh and clean on black. Reads as "new", not as "go".'],
    ['16', 'Mocha mousse', '#c49a82', 'Pantone\'s colour of 2025, lifted for black. Warm, quiet, grown-up.'],
    ['17', 'Electric orange', '#ff8a1f', 'Bright orange without the red. Energetic, close to clay\'s spirit.'],
    ['18', 'Aqua', '#3fd8e6', 'Bright cyan-blue. Crisp on black, a little sci-fi.'],
    ['From the illustration'],
    ['19', 'Sweater', '#e8664c', 'Her jumper\'s brick red, lifted for black. The hero and footer share one red.'],
    ['20', 'Blush', '#f4a88e', 'The pink of her cheeks and the chair. Warm and gentle.'],
    ['21', 'Honey oak', '#e2aa66', 'The table top. Warm gold; links feel like the room in the hero.'],
    ['22', 'Oat', '#eadcbf', 'The trousers, mug and book pages. Barely a colour: a warm white.'],
    ['23', 'Cocoa', '#c9946e', 'Her hair and Moss\'s fur, lifted. Quiet and warm.'],
    ['24', 'Leaf', '#b2c47e', 'The leaf on Moss\'s head. The one green in the picture.'],
    ['25', 'Sage teal', '#8fcabb', 'The opposite of her red on the colour wheel: complements the hero rather than repeating it.'],
    ['26', 'Dusk blue', '#a3bcdc', 'The cool grey-blue of the laptop, warmed up. Calm against all that red.'],
    ['From your references'],
    ['27', 'Periwinkle', '#7b8ff0', 'Ref 1: the headline blue on the navy page. Cool, soft, very digital.', '#2d2a52'],
    ['28', 'Paper cream', '#ece0d0', 'Ref 2: the cream type on burnt orange. Warm white; a quiet hover.', '#b0561e'],
    ['29', 'Sketch peach', '#dca286', 'Ref 2: the doodle colour. Dusty peach, hand-made feel.', '#b0561e'],
    ['30', 'Pool aqua', '#9ad5de', 'Ref 3: the page colour. Light and cool against the warm hero.', '#9ad5de'],
    ['31', 'Teal', '#5fa8b6', 'Ref 3: the headline and flower teal, lifted for black (as given it fails AA).', '#9ad5de'],
    ['32', 'Pumpkin', '#ec7a2a', 'Ref 3: the jumper orange. Close to her red jumper, a step brighter.', '#9ad5de'],
    ['33', 'Hot coral', '#fb6d43', 'Ref 4: the card colour. Bold and modern; clay turned up loud.', '#fb6d43'],
    ['34', 'Soft violet', '#cba6fb', 'Ref 4: the next card\'s lilac. Pairs with coral on that site.', '#cba6fb'],
    ['35', 'Flame', '#ff5a45', 'Ref 5: the red-orange type on brick red. Confident and warm.', '#93242a'],
    ['36', 'Oxblood, lifted', '#e5545a', 'Ref 6: the deep red type on cream, brightened so it reads on black.', '#efe5d6'],
  ];

  // WCAG relative luminance and contrast against the footer ground.
  const lum = hex => {
    const c = hex.match(/\w\w/g).map(h => parseInt(h, 16) / 255)
      .map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };

  const tpl = document.getElementById('foot');
  const root = document.getElementById('opts');
  for (const [n, name, hex, note, src] of options) {
