<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 656" role="img" aria-label="Developer journey map from discovering the Okta Integration Network through submission, review and publishing, with friction points marked at the manifest spec and the fix-and-resubmit stage">
  <rect width="1400" height="656" fill="#f4ece1"/>
  <text x="60" y="60" font-family="system-ui" font-size="16" font-weight="700" letter-spacing="3" fill="#17120f">DEVELOPER JOURNEY — DISCOVERY TO MAINTENANCE</text>

  <!-- baseline -->
  <line x1="100" y1="300" x2="1340" y2="300" stroke="#ddd2c3" stroke-width="2"/>

  <!-- iteration loop, fix & resubmit back to build -->
  <path d="M 920 310 C 860 460 580 460 520 310" fill="none" stroke="#e8613c" stroke-width="2" stroke-dasharray="7 7"/>
  <polygon points="520,310 536,304 528,324" fill="#e8613c"/>
  <text x="720" y="470" font-family="system-ui" font-size="13" fill="#a83a19" text-anchor="middle">the loop most submissions actually take</text>

  <!-- node 1: Discover -->
  <circle cx="120" cy="300" r="10" fill="#17120f"/>
  <text x="120" y="260" font-family="system-ui" font-size="15" font-weight="600" fill="#17120f" text-anchor="middle">Discover OIN</text>

  <!-- node 2: Read the spec (friction) -->
  <circle cx="320" cy="300" r="12" fill="#e8613c" stroke="#17120f" stroke-width="1.5"/>
  <text x="320" y="340" font-family="system-ui" font-size="15" font-weight="600" fill="#17120f" text-anchor="middle">Read the manifest spec</text>
  <text x="320" y="362" font-family="system-ui" font-size="12" fill="#a83a19" text-anchor="middle">steepest drop-off in the audit</text>

  <!-- node 3: Build -->
  <circle cx="520" cy="300" r="10" fill="#17120f"/>
  <text x="520" y="260" font-family="system-ui" font-size="15" font-weight="600" fill="#17120f" text-anchor="middle">Build the connector</text>

  <!-- node 4: Submit -->
  <circle cx="720" cy="300" r="10" fill="#17120f"/>
  <text x="720" y="340" font-family="system-ui" font-size="15" font-weight="600" fill="#17120f" text-anchor="middle">Submit for review</text>

  <!-- node 5: Fix & resubmit (friction) -->
  <circle cx="920" cy="300" r="12" fill="#e8613c" stroke="#17120f" stroke-width="1.5"/>
  <text x="920" y="260" font-family="system-ui" font-size="15" font-weight="600" fill="#17120f" text-anchor="middle">Fix &amp; resubmit</text>
  <text x="920" y="238" font-family="system-ui" font-size="12" fill="#a83a19" text-anchor="middle">longest wait, no visibility into why</text>

  <!-- node 6: Published -->
  <circle cx="1120" cy="300" r="10" fill="#17120f"/>
  <text x="1120" y="340" font-family="system-ui" font-size="15" font-weight="600" fill="#17120f" text-anchor="middle">Get published</text>

  <!-- node 7: Maintain -->
  <circle cx="1320" cy="300" r="10" fill="#17120f"/>
  <text x="1320" y="260" font-family="system-ui" font-size="15" font-weight="600" fill="#17120f" text-anchor="middle">Maintain &amp; version</text>

  <!-- legend -->
  <circle cx="70" cy="600" r="7" fill="#e8613c" stroke="#17120f" stroke-width="1.5"/>
  <text x="90" y="605" font-family="system-ui" font-size="13" fill="#5d534a">Friction point identified in the existing-experience audit</text>
</svg>
