<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 900" role="img" aria-label="Information architecture of the OIN developer portal: the portal root branching into documentation, submission console, manifest editor, review status, component library and partner directory, each with two sub-sections">
  <rect width="1450" height="900" fill="#f4ece1"/>
  <text x="30" y="40" font-family="system-ui" font-size="16" font-weight="700" letter-spacing="3" fill="#17120f">INFORMATION ARCHITECTURE — OIN DEVELOPER PORTAL</text>

  <!-- root -->
  <rect x="545" y="70" width="360" height="70" rx="2" fill="#17120f"/>
  <text x="725" y="113" font-family="system-ui" font-size="17" font-weight="700" fill="#f4ece1" text-anchor="middle">OIN Developer Portal</text>

  <!-- connectors root to children -->
  <g stroke="#ddd2c3" stroke-width="2">
    <line x1="725" y1="140" x2="145" y2="225"/>
    <line x1="725" y1="140" x2="383" y2="225"/>
    <line x1="725" y1="140" x2="621" y2="225"/>
    <line x1="725" y1="140" x2="859" y2="225"/>
    <line x1="725" y1="140" x2="1097" y2="225"/>
    <line x1="725" y1="140" x2="1335" y2="225"/>
  </g>

  <!-- children -->
  <g font-family="system-ui" font-size="13" font-weight="600" fill="#17120f" text-anchor="middle">
    <rect x="45" y="225" width="200" height="60" rx="2" fill="#f4ece1" stroke="#17120f" stroke-width="1.5"/>
    <text x="145" y="260">Documentation</text>

    <rect x="283" y="225" width="200" height="60" rx="2" fill="#f4ece1" stroke="#17120f" stroke-width="1.5"/>
    <text x="383" y="260">Submission console</text>

    <rect x="521" y="225" width="200" height="60" rx="2" fill="#f4ece1" stroke="#17120f" stroke-width="1.5"/>
    <text x="621" y="260">Manifest editor</text>

    <rect x="759" y="225" width="200" height="60" rx="2" fill="#f4ece1" stroke="#17120f" stroke-width="1.5"/>
    <text x="859" y="260">Review status</text>

    <rect x="997" y="225" width="200" height="60" rx="2" fill="#f4ece1" stroke="#17120f" stroke-width="1.5"/>
    <text x="1097" y="260">Component library</text>

    <rect x="1235" y="225" width="200" height="60" rx="2" fill="#f4ece1" stroke="#17120f" stroke-width="1.5"/>
    <text x="1335" y="260">Partner directory</text>
  </g>

  <!-- grandchildren connectors -->
  <g stroke="#ddd2c3" stroke-width="1.5">
    <line x1="145" y1="285" x2="90" y2="360"/>
    <line x1="145" y1="285" x2="200" y2="360"/>
    <line x1="383" y1="285" x2="328" y2="360"/>
    <line x1="383" y1="285" x2="438" y2="360"/>
    <line x1="621" y1="285" x2="566" y2="360"/>
    <line x1="621" y1="285" x2="676" y2="360"/>
    <line x1="859" y1="285" x2="804" y2="360"/>
    <line x1="859" y1="285" x2="914" y2="360"/>
    <line x1="1097" y1="285" x2="1042" y2="360"/>
    <line x1="1097" y1="285" x2="1152" y2="360"/>
    <line x1="1335" y1="285" x2="1280" y2="360"/>
    <line x1="1335" y1="285" x2="1390" y2="360"/>
  </g>

  <!-- grandchildren -->
  <g font-family="system-ui" font-size="12" fill="#5d534a" text-anchor="middle">
    <rect x="20" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="90" y="391">Getting started</text>
    <rect x="130" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="200" y="391">API reference</text>

    <rect x="258" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="328" y="391">New submission</text>
    <rect x="368" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="438" y="391">Status tracker</text>

    <rect x="496" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="566" y="391">Schema validator</text>
    <rect x="606" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="676" y="391">Field library</text>

    <rect x="734" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="804" y="391">Findings log</text>
    <rect x="844" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="914" y="391">Resubmit flow</text>

    <rect x="972" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="1042" y="391">UI kit</text>
    <rect x="1082" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="1152" y="391">Validation states</text>

    <rect x="1210" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="1280" y="391">Public listings</text>
    <rect x="1320" y="360" width="140" height="52" rx="2" fill="none" stroke="#ddd2c3" stroke-width="1.5"/>
    <text x="1390" y="391">ISV profiles</text>
  </g>

  <text x="725" y="480" font-family="system-ui" font-size="13" fill="#a83a19" text-anchor="middle">Manifest editor and Review status are new — the audit found neither existed as its own surface before</text>
</svg>
